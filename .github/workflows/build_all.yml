name: Build AZM AI (Windows + Android + Web)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=windows .
      - run: Remove-Item -Force -ErrorAction SilentlyContinue test/widget_test.dart
        shell: pwsh
      - run: flutter pub get
      - run: flutter test test/azm_core_test.dart
      - run: flutter build windows --release
      - name: Package Windows Release
        shell: pwsh
        run: |
          $dir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $dir)) { $dir = "build/windows/runner/Release" }
          Compress-Archive -Path "$dir/*" -DestinationPath "azm_ai_windows_release.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: azm_ai_windows_release
          path: azm_ai_windows_release.zip

  build_android:
    name: Build Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=android .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: azm_ai_android_apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build_web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --platforms=web .
      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - run: flutter build web --release
      - uses: actions/upload-artifact@v4
        with:
          name: azm_ai_web_release
          path: build/web
