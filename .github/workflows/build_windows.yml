name: Build AZM AI Windows Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run unit tests
        run: flutter test

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Package Release folder
        shell: pwsh
        run: |
          $releaseDir = "build/windows/x64/runner/Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build/windows/runner/Release"
          }
          Compress-Archive -Path "$releaseDir/*" -DestinationPath "azm_ai_windows_release.zip" -Force

      - name: Upload Windows Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: azm_ai_windows_release
          path: azm_ai_windows_release.zip
          retention-days: 30
